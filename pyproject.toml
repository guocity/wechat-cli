[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wechat-cli"
version = "0.2.4"
description = "Local Python CLI, REST API and web interface for macOS and Windows WeChat"
readme = "README.md"
requires-python = ">=3.11"
license = "ISC"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "truststore>=0.10,<1",
  "frida==17.8.0; sys_platform == 'darwin' or sys_platform == 'win32'",
  "cryptography>=44,<49; sys_platform == 'darwin'",
  "Pillow>=11,<13; sys_platform == 'darwin'",
  "zstandard>=0.23,<1; sys_platform == 'win32' and python_version < '3.14'",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
wechat-cli = "wechat_cli.cli:main"

[dependency-groups]
dev = ["capstone>=5,<6", "pytest>=8,<10", "ruff>=0.11,<1", "twine>=6,<7", "cryptography>=44,<49", "Pillow>=11,<13"]

[tool.hatch.build]
artifacts = ["src/wechat_cli/backends/macos/assets/bin/*"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/wechat_cli"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/pyproject.toml", "/README.md", "/LICENSE", "/tools", "/docs", "/hatch_build.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
